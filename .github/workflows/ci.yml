name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # axion-release 는 태그로 버전을 계산하므로 전체 히스토리가 필요하다.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 현재 버전 출력
        run: ./gradlew versions

      - name: 빌드 & 테스트
        run: ./gradlew build
