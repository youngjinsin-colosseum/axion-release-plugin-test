name: Auto Release

# main 에 커밋이 들어오면, 변경된 모듈만 자동으로 릴리스(태그 생성 & push)한다.
#
# - 어떤 모듈을 올릴지: axion 의 monorepo 설정이 판단한다.
#   변경이 없는 모듈은 "nothing to release" 로 스스로 건너뛴다.
# - 얼마나 올릴지: 직전 태그 이후 커밋 메시지에서 판정한다.
#   feat!: / BREAKING CHANGE -> major, feat: -> minor, 그 외 -> patch
#   (판정 로직은 루트 build.gradle.kts 의 conventionalIncrementer)
#
# PR 머지가 아니라 push 를 트리거로 쓰는 이유:
#
#   1. push 이벤트는 체크아웃 대상이 그 푸시의 커밋(github.sha)으로 고정된다.
#      pull_request 에서 `ref: main` 을 쓰면 "잡이 도는 순간의 main" 을 다시
#      조회하게 되어, 그 사이 머지된 다른 PR 의 변경까지 함께 태그해버린다.
#   2. concurrency 큐에는 하나만 대기할 수 있어 연속 머지 시 중간 잡이 취소된다.
#      증가 폭이 커밋 메시지에 있으면, 살아남은 잡이 직전 태그 이후 커밋을
#      전부 훑으므로 취소된 잡의 몫까지 정확히 반영된다.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

# 태그 push 가 서로 겹치지 않도록 직렬화한다.
# (버전 계산 자체는 어느 잡이 언제 돌아도 같은 결과를 내므로 취소돼도 안전하다)
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # ref 를 지정하지 않으면 이 push 의 커밋을 그대로 체크아웃한다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 릴리스 전 버전 확인
        run: ./gradlew --no-parallel versions

      - name: 빌드 & 테스트
        run: ./gradlew build

      - name: 변경된 모듈 릴리스
        id: release
        run: |
          # 4개 프로젝트 모두에 release 를 걸어도, 변경 없는 모듈은 태그를 만들지 않는다.
          # 증가 폭은 모듈별로 빌드 스크립트가 계산하므로 CLI 로 넘길 것이 없다.
          ./gradlew --no-parallel release :a:release :b:release :c:release \
            -Prelease.disableChecks \
            -Prelease.pushTagsOnly \
            -Prelease.customUsername=x-access-token \
            -Prelease.customPassword=${{ secrets.GITHUB_TOKEN }}

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 자동 릴리스 결과"
            echo ""
            echo "- 커밋: \`${{ github.sha }}\`"
            echo ""
            echo '```'
            echo "released-version: ${{ steps.release.outputs.released-version }}"
            ./gradlew -q --no-parallel versions
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
